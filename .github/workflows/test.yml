name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync upstream (materialize dist for contract/regression tests)
        # dist/ 不入库；persistent-data / image-error / upstream-contract 都读取上游产物。
        # 用纯 Node 同步（无需 Python），只做测试所需的 dist 物化。
        run: node scripts/sync-upstream.js --ref main

      - name: Syntax checks
        run: node --check src/launcher.js; node --check src/electron-main.js; node --check src/proxy.js; node --check src/preload.js; node --check src/window-controls.js; node --check src/portable-paths.js; node --check src/build-info.js; node --check scripts/sync-upstream.js; node --check scripts/release-portable.js

      - name: Run tests
        run: npm test